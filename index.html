<script>

const AR2='وَمِنَ ٱلنَّاسِ وَٱلدَّوَآبِّ وَٱلْأَنْعَٰمِ مُخْتَلِفٌ أَلْوَٰنُهُۥ كَذَٰلِكَ ۗ إِنَّمَا يَخْشَى ٱللَّهَ مِنْ عِبَادِهِ ٱلْعُلَمَٰٓؤُا۟ ۗ إِنَّ ٱللَّهَ عَزِيزٌ غَفُورٌ ﴿٢٨﴾';
const MAT=[
['Pengertian & Keutamaan Ulama','Ulama (jamak dari <i>alim</i>) adalah orang yang berilmu agama mendalam, takut kepada Allah, mengamalkan ilmunya, dan membimbing umat. QS. Fāṭir: 28 menegaskan bahwa yang paling takut kepada Allah adalah ulama; QS. al-Mujādilah: 11 menjanjikan derajat tinggi bagi orang beriman dan berilmu. Nabi ﷺ bersabda: <span class="ar" style="font-size:1.3rem;line-height:2">اَلْعُلَمَاءُ وَرَثَةُ الْأَنْبِيَاءِ</span> "Ulama adalah pewaris para nabi."'],
['Peran Ulama','Ulama berperan sebagai (1) pengajar dan pendidik umat, (2) penulis kitab/karya ilmiah, (3) pembimbing akhlak dan spiritual, (4) penjaga akidah Ahlussunnah wal Jama\'ah, (5) pejuang kemerdekaan dan pemersatu bangsa.'],
['Syekh Nawawi al-Bantani (1813–1897)','Lahir di Tanara, Banten, lalu menetap dan mengajar di Makkah. Dijuluki <b>Sayyid Ulama Hijaz</b>. Karya: tafsir <i>Marāḥ Labīd</i> (Tafsir Munir), <i>Nihāyatuz Zain</i>, <i>Syarḥ \'Uqūd al-Lujain</i>, <i>Kāsyifatus Sajā</i>. Muridnya antara lain KH. Hasyim Asy\'ari dan KH. Kholil Bangkalan. Keteladanan: produktif menulis dan ikhlas mengajar.'],
['Syekh Mahfudz at-Termasi (1868–1920)','Lahir di Termas, Pacitan, Jawa Timur; mengajar di Masjidil Haram. Ahli hadis dan qiraat. Karya: <i>Mauhibah Żī al-Faḍl</i> dan <i>Manhaj Żawī an-Naẓar</i>. Gurunya KH. Hasyim Asy\'ari dalam bidang hadis (Shahih Bukhari). Keteladanan: kesungguhan menjaga sanad keilmuan.'],
['Syekh Ahmad Khatib al-Minangkabawi (1860–1916)','Lahir di Bukittinggi, Sumatra Barat; menjadi imam dan khatib Masjidil Haram bermazhab Syafi\'i. Muridnya antara lain KH. Ahmad Dahlan (pendiri Muhammadiyah) dan KH. Hasyim Asy\'ari (pendiri NU). Keteladanan: berani menyuarakan kebenaran dan melahirkan tokoh pembaru.'],
['KH. Hasyim Asy\'ari (1871–1947)','Lahir di Jombang, mendirikan Pesantren Tebuireng (1899) dan Nahdlatul Ulama (1926). Mengeluarkan <b>Resolusi Jihad</b> 22 Oktober 1945 yang menggerakkan perlawanan 10 November di Surabaya. Karya: <i>Adābul \'Ālim wal Muta\'allim</i>. Dikenal dengan semangat <i>hubbul wathan minal īmān</i> (cinta tanah air bagian dari iman).'],
['Syekh Yasin al-Fadani (1915–1990)','Lahir di Padang, Sumatra Barat; mengajar di Makkah. Dijuluki <b>Musnid ad-Dunyā</b> (ahli sanad hadis dunia). Karya: <i>al-Fawā\'id al-Janiyyah</i>. Keteladanan: menjaga mata rantai sanad ilmu.'],
['Hikmah & Teladan','Meneladani ulama berarti: menuntut ilmu dengan sungguh-sungguh, ikhlas, tawadu\', istiqamah menulis/mengajar, menghormati guru, mengamalkan ilmu, dan mencintai tanah air serta menjaga persatuan.']];

const KUIS=[
[['Syekh Nawawi al-Bantani berasal dari…','Banten','Padang','Pacitan','Jombang','Madura',2],['NU didirikan KH. Hasyim Asy\'ari pada tahun…','1926','1912','1945','1908','1930',0],['Imam Masjidil Haram asal Minangkabau bermazhab Syafi\'i adalah…','Syekh Ahmad Khatib','Syekh Nawawi','Syekh Mahfudz','KH. Hasyim','Syekh Yasin',3]],
[['Tafsir karya Syekh Nawawi bernama…','Marah Labid','Mauhibah Dzil Fadhl','Adabul Alim','Al-Fawaid al-Janiyyah','Kasyifatus Saja',1],['Syekh Mahfudz at-Termasi berasal dari Termas, kabupaten…','Pacitan','Jombang','Padang','Banten','Kediri',4],['Julukan Syekh Yasin al-Fadani adalah…','Musnid ad-Dunya','Sayyid Ulama Hijaz','Hujjatul Islam','Imam Haramain','Syaikhul Islam',0]],
[['Kitab Adabul Alim wal Muta\'allim ditulis oleh…','KH. Hasyim Asy\'ari','Syekh Nawawi','KH. Ahmad Dahlan','Syekh Yasin','Syekh Mahfudz',2],['Murid Syekh Ahmad Khatib yang mendirikan Muhammadiyah…','KH. Ahmad Dahlan','KH. Wahid Hasyim','KH. Kholil','KH. Hasyim','Syekh Nawawi',3],['Sikap yang diteladani dari ulama dalam menuntut ilmu…','Ikhlas dan istiqamah','Sombong','Malas','Pamrih','Putus asa',0]],
[['Resolusi Jihad dikeluarkan pada…','22 Oktober 1945','17 Agustus 1945','10 November 1945','28 Oktober 1928','1 Juni 1945',4],['Pesantren yang didirikan KH. Hasyim Asy\'ari adalah…','Tebuireng','Gontor','Lirboyo','Sidogiri','Tremas',0],['QS. Fāṭir: 28 menegaskan yang paling takut kepada Allah adalah…','Ulama','Raja','Pedagang','Pemuda','Prajurit',1]],
[['"Hubbul wathan minal iman" paling dekat dengan nilai…','Nasionalisme religius','Individualisme','Materialisme','Apatisme','Sekularisme',3],['Sikap tepat generasi muda terhadap warisan ulama…','Mempelajari karyanya dan mengamalkannya','Mengabaikan','Hanya mengagumi','Menyalin tanpa paham','Menunggu orang lain',0],['QS. al-Mujādilah: 11 menjanjikan…','Allah mengangkat derajat orang beriman dan berilmu','Harta melimpah','Umur panjang','Jabatan tinggi','Bebas ujian',2]]];
const LAT=[
['Ulama disebut pewaris nabi karena mewarisi…','Ilmu dan dakwah','Harta','Kekuasaan','Tanah','Garis keturunan',0],
['Pusat pengajaran Syekh Nawawi, Mahfudz, dan Khatib adalah…','Makkah (Masjidil Haram)','Kairo','Baghdad','Cordoba','Damaskus',4],
['Karya Syekh Mahfudz at-Termasi di bidang…','Hadis','Astronomi','Kedokteran','Filsafat Yunani','Sejarah',1],
['Gelar "Sayyid Ulama Hijaz" disandang…','Syekh Nawawi al-Bantani','Syekh Yasin','KH. Hasyim','KH. Dahlan','Syekh Mahfudz',2],
['Hasil nyata Resolusi Jihad adalah…','Perlawanan rakyat Surabaya 10 November','Proklamasi','Sumpah Pemuda','Konferensi Asia Afrika','Pemilu 1955',3],
['Yang termasuk keteladanan ulama…','Tawadu\' dan produktif berkarya','Gila hormat','Menimbun ilmu','Menghindari guru','Berputus asa',0],
['Syekh Yasin al-Fadani berasal dari…','Padang','Banten','Pacitan','Jombang','Bukittinggi lalu Mesir',1],
['Hubungan KH. Hasyim dengan Syekh Ahmad Khatib…','Murid dan guru','Saudara kandung','Rival','Tidak kenal','Rekan dagang',2],
['Cara meneladani ulama di sekolah…','Rajin belajar dan menghormati guru','Menyontek','Bolos','Membully','Menunda tugas',0],
['Pesan inti QS. al-Mujādilah: 11 bagi pelajar…','Berilmu dan beradab dalam majelis','Mengabaikan majelis','Berebut tempat','Menyela pembicaraan','Meninggalkan majelis',4]];
const EVA=[
['Ulama Nusantara dapat berpengaruh di Haramain terutama karena…','Kedalaman ilmu, karya tulis, dan jaringan sanad','Kekuasaan politik','Kekayaan','Dukungan militer','Jumlah pengikut saja',3],
['Persamaan Syekh Nawawi, Mahfudz, dan Khatib adalah…','Orang Nusantara yang menjadi guru di Makkah','Pejabat kolonial','Pendiri negara','Pedagang rempah','Ulama Mesir',0],
['Keterkaitan Syekh Ahmad Khatib dengan Muhammadiyah dan NU…','Gurunya KH. Ahmad Dahlan dan KH. Hasyim Asy\'ari','Pendiri keduanya','Penentang keduanya','Tidak berhubungan','Penulis AD/ART keduanya',1],
['Mengapa Resolusi Jihad dinilai sah secara agama dan relevan?','Membela tanah air dari penjajah termasuk jihad','Memicu perang saudara','Menolak negara','Mencari harta rampasan','Menggantikan proklamasi',2],
['Kritik tepat bagi pelajar yang mengutip ulama tanpa membaca karyanya…','Kurang rujukan primer dan rawan salah paham','Sudah pasti benar','Lebih hemat waktu','Tidak masalah','Lebih ilmiah',0],
['Implementasi "ilmu disertai khasyyah" (QS. Fāṭir: 28) dalam sains modern…','Riset yang jujur, bermanfaat, dan menjaga ciptaan Allah','Riset demi popularitas','Menutup hasil riset','Plagiasi','Menolak teknologi',4],
['Konsep sanad pada Syekh Yasin al-Fadani menunjukkan…','Kehati-hatian menjaga keaslian ilmu','Kebiasaan menyalin','Pembatasan ilmu','Ketidakpercayaan pada buku','Formalitas administratif',1],
['Analisis tepat: cinta tanah air dan agama menurut KH. Hasyim…','Saling menguatkan','Saling bertentangan','Tidak berkaitan','Agama lebih rendah','Nasionalisme menggantikan agama',3],
['Strategi mewarisi semangat ulama di era digital…','Menulis dan mendakwahkan konten bermanfaat serta valid','Menyebar hoaks bernuansa agama','Mengejar viral','Menghindari teknologi','Mengkafirkan pihak lain',0],
['Evaluasi: tindakan yang BERTENTANGAN dengan teladan ulama…','Mengklaim ilmu tanpa adab dan tanpa sanad','Rajin muraja\'ah','Menghormati guru','Menulis ilmiah','Menjaga persatuan',2]];
const TP=["Membaca QS. al-Mujādilah: 11 dan QS. Fāṭir: 28 dengan tartil serta memahami kandungannya.", "Menjelaskan pengertian, keutamaan, dan peran ulama.", "Mengidentifikasi biografi, karya, dan keteladanan ulama Indonesia yang mendunia.", "Menganalisis kontribusi ulama bagi bangsa, agama, dan dunia.", "Meneladani sikap ikhlas, tawadu', istiqamah, dan cinta tanah air."];
const tp=()=>`<div class="card"><h3>🎯 Tujuan Pembelajaran</h3><p>Setelah mempelajari bab ini, peserta didik mampu:</p><ol>${TP.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
let U=null,P={},cur=0,tmr=null;
const $=id=>document.getElementById(id),key=()=>'pai11b5_'+U.n.toLowerCase()+'_'+U.c;
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(P))}catch(e){}};
const load=()=>{try{P=JSON.parse(localStorage.getItem(key()))||{}}catch(e){P={}}P.k=P.k||[];P.d=P.d||{}};
const kuisDone=()=>[0,1,2,3,4].every(i=>(P.k[i]||0)>=KKM);
const unlocked=i=>i==7||i==0||(i==1&&P.d[0])||(i==2&&P.d[1])||(i==3&&P.d[2])||(i==4&&P.d[3])||(i==5&&kuisDone())||(i==6&&kuisDone()&&P.d[5]);
function opts(q){const a=q.slice(2,6);a.splice(q[6],0,q[1]);return a}
function nav(){$('nav').innerHTML=SEC.map((s,i)=>`<button class="${i==cur?'on':''}" ${unlocked(i)?'':'disabled'} onclick="go(${i})">${unlocked(i)?'':'🔒 '}${s}</button>`).join('')+'<button onclick="location.reload()">Keluar</button>'}
function go(i){clearInterval(tmr);$('tm').style.display='none';cur=i;nav();[tad,mat,rin,pro,kuisMenu,()=>quiz('lat',LAT,0,'Latihan Soal'),()=>quiz('ev',EVA,15,'Soal Evaluasi (Sulit & Sangat Sulit)'),rekap][i]();scrollTo(0,0)}
function login(){$('nav').innerHTML='';$('m').innerHTML=`<div class="card"><h2>Masuk</h2><label>Nama Lengkap</label><input id="n"><label>Kelas</label><select id="c">${CL.map(c=>`<option>${c}</option>`).join('')}</select><label>Password kelas</label><input id="p" type="password"><button class="btn" onclick="doLogin()">Masuk</button><p id="er" class="no"></p></div>`}
function doLogin(){const n=$('n').value.trim(),c=$('c').value;if(!n)return $('er').textContent='Nama lengkap wajib diisi.';if($('p').value!==PW[c])return $('er').textContent='Password kelas salah.';U={n,c};load();go(0)}
function done(i,next){P.d[i]=1;save();go(next)}
function tad(){$('m').innerHTML=tp()+`<div class="card"><h2>📖 Tadarus</h2><p>Bacalah ayat berikut dengan tartil, perhatikan tanda waqaf (ۖ boleh berhenti/lanjut, ۗ lebih baik berhenti).</p><h3>QS. al-Mujādilah: 11</h3><div class="ar">${AR1}</div><h3>QS. Fāṭir: 28</h3><div class="ar">${AR2}</div><p><i>Terjemah 58:11:</i> "Wahai orang-orang beriman! Apabila dikatakan kepadamu, 'Berilah kelapangan di dalam majelis-majelis,' maka lapangkanlah, niscaya Allah akan memberi kelapangan untukmu. Apabila dikatakan, 'Berdirilah kamu,' maka berdirilah, niscaya Allah akan mengangkat derajat orang-orang beriman di antaramu dan orang-orang yang diberi ilmu beberapa derajat. Allah Maha Teliti terhadap apa yang kamu kerjakan."</p><p><i>Terjemah 35:28:</i> "...Di antara hamba-hamba Allah yang takut kepada-Nya hanyalah para ulama. Sungguh, Allah Maha Perkasa lagi Maha Pengampun."</p><button class="btn" onclick="done(0,1)">✔ Selesai Tadarus → Materi</button></div>`}
function mat(){$('m').innerHTML=tp()+`<h2>📚 Materi Pembelajaran</h2>`+MAT.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')+`<button class="btn" onclick="done(1,2)">✔ Selesai Membaca → Ringkasan</button>`}
function rin(){$('m').innerHTML=`<div class="card"><h2>📝 Ringkasan Materi</h2><ul>${SUM.map(s=>`<li>${s}</li>`).join('')}</ul><button class="btn" onclick="done(2,3)">✔ Lanjut → Proyek</button></div>`}
function pro(){$('m').innerHTML=`<h2>🛠 Proyek (pilih salah satu atau kerjakan semuanya)</h2>`+PRJ.map(p=>`<div class="card"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')+`<button class="btn" onclick="done(3,4)">✔ Lanjut → Kuis</button>`}
function kuisMenu(){$('m').innerHTML=`<div class="card"><h2>🎯 Kuis 5 Level</h2><p>Setiap level 3 soal, waktu 5 menit, KKM ${KKM}. Level berikutnya terbuka jika level sebelumnya lulus.</p>`+[0,1,2,3,4].map(i=>{const s=P.k[i],ok=i==0||(P.k[i-1]||0)>=KKM;return `<p>Level ${i+1}: <b>${s==null?'belum':s}</b> ${s>=KKM?'✅':''} <button class="btn" ${ok?'':'disabled'} onclick="quiz('k${i}',KUIS[${i}],5,'Kuis Level ${i+1}')">${ok?'Mulai':'🔒'}</button></p>`}).join('')+(kuisDone()?'<p class="ok">Semua level lulus! Lanjut ke Latihan.</p><button class="btn" onclick="go(5)">Latihan →</button>':'')+'</div>'}
function quiz(id,Q,min,title){let t=min*60;const ps=Q.map(opts);$('m').innerHTML=`<div class="card"><h2>${title}</h2>`+Q.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>`+ps[i].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" style="width:auto;margin:0 8px 0 0"> ${'ABCDE'[j]}. ${o}</label>`).join('')+'</div>').join('')+`<button class="btn" onclick="fin()">Kumpulkan</button></div>`;
window.fin=function(){clearInterval(tmr);$('tm').style.display='none';let r=0,h='';Q.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`),c=q[6];if(v&&+v.value==c)r++;h+=`<p>${i+1}. ${v&&+v.value==c?'<span class=ok>Benar</span>':'<span class=no>Salah</span>'} — Jawaban: ${'ABCDE'[c]}. ${ps[i][c]}</p>`});const s=Math.round(r/Q.length*100);
if(id[0]=='k')P.k[+id[1]]=Math.max(P.k[+id[1]]||0,s);else if(id=='lat'){P.l=s;P.d[5]=1}else P.e=Math.max(P.e||0,s);save();
